  <body>
    <!-- Filtro SVG nativo para textura de papel arrugado (Cara 1 del recibo) -->
    <svg width="0" height="0" style="position:absolute;pointer-events:none;opacity:0;">
      <defs>
        <filter id="wrinkled-paper" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
          <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="2.2" result="light">
            <feDistantLight azimuth="55" elevation="58" />
          </feDiffuseLighting>
          <feBlend mode="multiply" in="SourceGraphic" in2="light" />
        </filter>
      </defs>
    </svg>
